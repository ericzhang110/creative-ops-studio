<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Creative Ops Studio</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">A</span>
          <div>
            <strong>Creative Ops</strong>
            <small>Banner & Social Studio</small>
          </div>
        </div>

        <nav class="mode-tabs" aria-label="工具">
          <button class="mode-tab is-active" data-mode="banner" type="button">
            <span>▦</span>
            <span>多语言 Banner</span>
          </button>
          <button class="mode-tab" data-mode="social" type="button">
            <span>◫</span>
            <span>社媒模板</span>
          </button>
        </nav>

        <section class="panel">
          <h2>尺寸</h2>
          <div class="preset-list" id="presetList"></div>
        </section>

        <section class="panel">
          <h2>语言</h2>
          <div class="language-grid" id="languageGrid"></div>
        </section>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <h1 id="modeTitle">多语言 Banner 生成器</h1>
            <p id="modeMeta">CSV 文案、核心尺寸、批量预览、PNG 导出</p>
          </div>
          <div class="actions">
            <button class="ghost" id="fitButton" type="button" title="适配预览">⛶</button>
            <button class="secondary" id="saveTemplate" type="button">存为模板</button>
            <button class="secondary" id="resetLayout" type="button">重置版式</button>
            <button class="primary" id="exportCurrent" type="button">导出当前</button>
            <button class="primary" id="exportBatch" type="button">批量导出</button>
          </div>
        </header>

        <div class="stage-wrap" id="stageWrap">
          <canvas id="previewCanvas" width="970" height="250" tabindex="0" aria-label="可编辑画布"></canvas>
        </div>

        <section class="output-strip">
          <div>
            <span class="metric" id="assetCount">0</span>
            <small>待导出素材</small>
          </div>
          <div>
            <span class="metric" id="selectedSpec">970 x 250</span>
            <small>当前画布</small>
          </div>
          <div>
            <span class="metric" id="activeLanguage">EN</span>
            <small>当前语言</small>
          </div>
        </section>
      </section>

      <aside class="inspector">
        <section class="panel">
          <h2>画布编辑</h2>
          <p class="hint" id="editHint">点击元素选中，拖动移动；拖控制点调整大小。方向键微调位置，Shift + 方向键每次移动 10px。</p>
          <div class="selected-chip" id="selectedElement">未选中元素</div>
          <div class="geometry-grid">
            <label>
              X
              <input id="elementXInput" type="number" step="1" />
            </label>
            <label>
              Y
              <input id="elementYInput" type="number" step="1" />
            </label>
            <label>
              W
              <input id="elementWInput" type="number" step="1" />
            </label>
            <label>
              H
              <input id="elementHInput" type="number" step="1" />
            </label>
            <label>
              字号
              <input id="elementFontInput" type="number" step="1" />
            </label>
          </div>
          <label>
            选中元素内容
            <input id="selectedContentInput" type="text" />
          </label>
          <div class="template-status" id="templateStatus">未保存模板</div>
          <button class="wide danger" id="deleteElement" type="button">删除选中元素</button>
        </section>

        <section class="panel">
          <h2>模板库</h2>
          <label>
            模板名称
            <input id="templateNameInput" type="text" value="Untitled template" />
          </label>
          <div class="tool-grid">
            <button class="wide" id="saveAsTemplate" type="button">保存为新模板</button>
            <button class="wide" id="updateTemplate" type="button">更新当前模板</button>
          </div>
          <label>
            调用模板
            <select id="templateSelect"></select>
          </label>
          <button class="wide" id="applyTemplate" type="button">应用选中模板</button>
        </section>

        <section class="panel">
          <h2>素材 / 新增要素</h2>
          <label class="file-control">
            上传图片素材
            <input id="imageUploadInput" type="file" accept="image/*" />
          </label>
          <div class="tool-grid">
            <button class="wide" data-add-element="text" type="button">添加文本框</button>
            <button class="wide" data-add-element="cta" type="button">添加按钮</button>
            <button class="wide" data-add-element="metric" type="button">添加数据</button>
            <button class="wide" data-add-element="product" type="button">添加产品视觉</button>
          </div>
        </section>

        <section class="panel">
          <h2>内容</h2>
          <label>
            标题
            <input id="headlineInput" type="text" />
          </label>
          <label>
            副标题
            <textarea id="subheadInput" rows="3"></textarea>
          </label>
          <label>
            按钮
            <input id="ctaInput" type="text" />
          </label>
          <label class="check-row">
            <input id="autoTranslateInput" type="checkbox" checked />
            <span>切换语言时用固定文案自动翻译</span>
          </label>
          <button class="wide" id="lockCopy" type="button">固定当前文案</button>
        </section>

        <section class="panel">
          <h2>CSV / 多语言</h2>
          <textarea id="csvInput" rows="7" spellcheck="false"></textarea>
          <button class="wide" id="loadCsv" type="button">载入多语言</button>
        </section>

        <section class="panel">
          <h2>样式</h2>
          <label>
            主色
            <input id="accentInput" type="color" value="#30e7d0" />
          </label>
          <label>
            背景
            <input id="backgroundInput" type="color" value="#101319" />
          </label>
          <label class="check-row">
            <input id="showMetricsInput" type="checkbox" checked />
            <span>显示数据模块</span>
          </label>
        </section>
      </aside>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
